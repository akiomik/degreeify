<!doctype html>
<!--
  Hand-written. See chordwiki-basic.html for what these fixtures are and are
  not; the same applies here.

  This one states no key at all, which real charts do. The chords are chosen
  so that no key accounts for them better than another: two keys explain four
  of the five and are not each other's relative, and the chart neither opens
  nor closes on either tonic. Inference is expected to decline, and the point
  of the fixture is that declining is what a chart like this deserves.
-->
<html lang="ja">
  <head>
    <title>Test Song - Test Artist</title>
    <link rel="canonical" href="https://ja.chordwiki.org/wiki/Test%20Song" />
  </head>
  <body>
    <div id="key">
      <form action="/wiki.cgi" method="get">
        <input type="hidden" name="c" value="view" />
        <input type="hidden" name="t" value="Test Song" />
        <select size="1" name="key" onchange="this.form.submit();">
          <option value="0" selected="">0</option>
        </select>
      </form>
    </div>

    <div class="main">
      <h1 class="title">Test Song</h1>
      <h2 class="subtitle">Test Artist</h2>
      <div>
        <p class="line comment"><strong>BPM=90 4/4</strong></p>
        <p class="line">
          <span class="wordtop">|</span>
          <span class="chord">DbM7</span>
          <span class="word">---- ---- |</span>
          <span class="chord">Cm7</span>
          <span class="word">---- ---- |</span>
        </p>
        <p class="line">
          <span class="wordtop">|</span>
          <span class="chord">Bbm</span>
          <span class="word">---- |</span>
          <span class="chord">Eb</span>
          <span class="word">---- |</span>
          <span class="chord">B</span>
          <span class="word">---- |</span>
        </p>
      </div>
    </div>
  </body>
</html>
